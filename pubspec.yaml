name: tamini
description: "Tamini food delivery app"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  provider: ^6.1.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  pull_to_refresh_flutter3: ^2.0.2
  web_socket_channel: ^3.0.0
  intl: ^0.20.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  web: ^1.1.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/launcher_icon.png
    - assets/images/adaptive_icon_fg.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_icon.png"
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/images/adaptive_icon_fg.png"
  remove_alpha_ios: true
  min_sdk_android: 21
