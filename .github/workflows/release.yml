name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0). Leave empty to read from pubspec.yaml.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml | head -n 1)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure signing from secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ALIAS" ]; then
            echo "::error::Missing signing secret(s). Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEYSTORE_ALIAS in the repo secrets."
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/tamini-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=tamini-release.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_ALIAS" \
            > android/key.properties

      # ---- Shorebird release: makes this version OTA-patchable ----
      # Installs the Shorebird CLI and authenticates with the CI token, then
      # builds AND uploads a Shorebird release so Dart-only fixes can be pushed
      # later via `shorebird patch` with no app reinstall.
      - name: Install Shorebird CLI
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash

      - name: Shorebird release (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Missing SHOREBIRD_TOKEN secret. Add it from https://console.shorebird.dev/account to enable OTA patches."
            exit 1
          fi
          $HOME/.shorebird/bin/shorebird release android \
            --build-name "${{ steps.version.outputs.version }}"

      # ---- Plain APK + version.json feed (for sideload / non-Shorebird) ----
      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Assemble release assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD=$(sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p' pubspec.yaml | head -n 1)
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/tamini-v${VERSION}.apk"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$f" "release-assets/tamini-${abi}-v${VERSION}.apk"
          done
          cat > release-assets/version.json <<EOF
          {
            "version": "${VERSION}",
            "build_number": "${BUILD}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tamini-v${VERSION}.apk",
            "notes": ""
          }
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" release-assets/tamini-*.apk release-assets/version.json \
            --title "Tamini v${VERSION}" \
            --generate-notes
