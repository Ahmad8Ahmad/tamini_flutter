name: Deploy PWA to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write version.json
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml | head -n 1)
          BUILD=$(sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p' pubspec.yaml | head -n 1)
          cat > web/version.json <<EOF
          {
            "version": "${VERSION}",
            "build_number": "${BUILD}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tamini-v${VERSION}.apk",
            "notes": ""
          }
          EOF

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href /tamini_flutter/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
